<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Lilizi</title>
<meta name="theme-color" content="#502163">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lilizi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#f4f5fb; --card:#fff; --ink:#2a1934; --muted:#7f7489; --line:#e4e2ee;
    --brand:#502163; --brand-soft:#edf0f9; --accent:#f7aa4d; --ok:#2f7a55; --warn:#b7791f; --bad:#b4413c;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;font-size:15px}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}

  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 0}
  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;font-size:20px;color:var(--brand);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .logo img{width:34px;height:34px}
  .who{font-size:13px;color:var(--muted)}
  .who button{border:0;background:none;color:var(--brand);padding:0 6px;cursor:pointer}
  #reload{font-size:18px;vertical-align:middle}
  nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:7px 14px;cursor:pointer;white-space:nowrap}
  nav button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:inset 0 -3px 0 var(--accent)}

  main{padding:4px 16px 110px;max-width:720px;margin:0 auto}
  h2{font-size:16px;margin:18px 2px 10px}
  .card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;
    border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat .l{font-size:12px;color:var(--muted)}
  .stat .v{font-size:19px;font-weight:700;margin-top:4px;direction:ltr;text-align:right}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .v{font-weight:600;direction:ltr;white-space:nowrap}
  .neg{color:var(--bad)}
  .pos{color:var(--ok)}
  .sec{font-weight:700;color:var(--brand);padding:12px 0 4px;border-bottom:0}
  .note{font-size:12px;color:var(--muted);padding:6px 0}

  .item{display:flex;gap:10px;align-items:flex-start}
  .item .main{flex:1;min-width:0}
  .item .t{font-weight:600}
  .item .m{font-size:13px;color:var(--muted);margin-top:3px}
  .item .amt{font-weight:700;direction:ltr;white-space:nowrap}
  .acts{display:flex;gap:6px;margin-top:10px}
  .acts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 12px;
    font-size:13px;cursor:pointer}
  .acts .del{color:var(--bad)}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);
    color:var(--brand);margin-inline-start:6px;vertical-align:middle}
  .pill.out{background:#fbe9e8;color:var(--bad)} .pill.low{background:#fdf3e1;color:var(--warn)}
  .pill.ok{background:#e6f3ec;color:var(--ok)}

  .search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    margin-bottom:10px}
  .fab{position:fixed;left:18px;bottom:22px;z-index:6;background:var(--brand);color:#fff;border:0;
    border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(80,33,99,.35);cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:30px 0}

  .sheet-bg{position:fixed;inset:0;background:rgba(30,20,25,.35);z-index:20;display:flex;align-items:flex-end;
    justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
    padding:18px 16px 26px}
  .sheet h3{margin:0 0 14px;font-size:17px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 2px 6px}
  .in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  .chips{display:flex;gap:6px;margin-top:6px}
  .chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;
    font-size:12px;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .btns{display:flex;gap:8px;margin-top:20px}
  .btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer}
  .btn.p{background:var(--brand);color:#fff} .btn.s{background:var(--bg)}
  .btn:disabled{opacity:.6}

  .login{max-width:360px;margin:12vh auto 0;padding:0 20px}
  .login .logo{font-size:30px;text-align:center;margin-bottom:24px}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw;text-align:center}
  .toast.err{background:var(--bad)}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  table.mt{width:100%;border-collapse:collapse;font-size:14px}
  .row .lab{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
  .row .lab .pill{margin:0}
  .np{border:1px solid var(--accent);background:#fffaf2;border-radius:12px;padding:4px 12px 12px;margin-top:8px}
  .np .t{font-weight:700;color:var(--brand);margin-top:8px}
  .info{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink);margin-bottom:10px;line-height:1.8}
  .link-btn{display:block;width:100%;border:1px dashed var(--brand);color:var(--brand);background:var(--card);
    border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer;font-weight:600}
  .an p{margin:0 0 10px;line-height:1.9}
  .an p:last-child{margin-bottom:0}
  .an .w{color:var(--warn)}
  .an b{direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>

<!-- ورود -->
<div id="login" class="login hidden">
  <div class="logo" style="flex-direction:column"><img src="icons/icon-512.png" alt="" style="width:110px;height:110px">Lilizi</div>
  <label>نام شما</label>
  <input id="lgUser" class="in" placeholder="مثلاً بهناز" list="lgNames">
  <datalist id="lgNames"><option value="لیلی"><option value="بهناز"></datalist>
  <label>رمز ورود</label>
  <input id="lgPin" class="in" type="password" inputmode="numeric" autocomplete="current-password">
  <div class="btns"><button class="btn p" id="lgBtn">ورود</button></div>
</div>

<!-- اپ -->
<div id="app" class="hidden">
  <header>
    <div class="top">
      <div class="logo"><img src="icons/icon-192.png" alt="">Lilizi</div>
      <div class="who"><button id="reload" title="به‌روزرسانی">↻</button><span id="whoName"></span><button id="logout">خروج</button></div>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="view"></main>
  <button id="fab" class="fab hidden">+ ثبت جدید</button>
</div>

<div id="modal" class="sheet-bg hidden"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- وضعیت ---------- */
const S = { pin:'', user:'', tab:'home', init:null, lists:{}, q:'' };
const TABS = [
  ['home','خانه'], ['sale','فروش'], ['stockIn','ورود کالا'], ['expense','هزینه'],
  ['payment','پرداخت'], ['product','موجودی'], ['accounts','حساب‌ها'], ['weekly','گزارش هفتگی'], ['monthly','گزارش ماهانه']
];

const store = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- ابزار ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enDigits = s => String(s==null?'':s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
// عدد منفی یا داخل پرانتز → «▼ −۱۲۳» قرمز
const fmtX = x => {
  const s = String(x==null?'':x).trim();
  let m = s.match(/^\((.+)\)$/) || s.match(/^-(\d.*)$/);
  return m ? {t:'▼ −' + m[1], neg:true} : {t:s || '—', neg:false};
};
const valSpan = x => {
  const s = String(x==null?'':x).trim();
  // جمع‌های نهایی در شیت با فلش آمده‌اند: ▼ بدهی (قرمز)، ▲ طلب (سبز)
  if (s.startsWith('▼')) return `<span class="v neg" style="font-weight:700">${esc(s)}</span>`;
  if (s.startsWith('▲')) return `<span class="v pos" style="font-weight:700">${esc(s)}</span>`;
  const f = fmtX(x); return `<span class="v ${f.neg?'neg':''}">${esc(f.t)}</span>`;
};
// متن گزارش (مثل "1,234" یا "(1,234)" یا "-") → عدد
const num = x => { if (typeof x === 'number') return x; const s = enDigits(x).trim(); if (!s || s==='-' || s==='—') return 0;
  const neg = /^\(.*\)$/.test(s) || /^-/.test(s); const n = Number(s.replace(/[^\d.]/g,'')) || 0; return neg ? -n : n; };
const fmtN = n => { n = Math.round(n); return n < 0 ? '▼ −' + (-n).toLocaleString('en-US') : n.toLocaleString('en-US'); };
const money = n => { const x = Number(n); if (n === '' || n == null || isNaN(x)) return n || '—'; return x.toLocaleString('en-US'); };

const API = 'https://script.google.com/macros/s/AKfycbxPTuvwTDmGTcbregDG7tCOs1hCqsiIF9-FYHIPJaUYNWpvAESdNoNbYwYFkJMLRPfUNQ/exec';
async function call(action, payload){
  let r;
  try {
    r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ pin:S.pin, user:S.user, action, payload: payload || {} }),
      redirect: 'follow'
    });
  } catch (e) {
    throw new Error('اتصال به اینترنت یا گوگل برقرار نیست');
  }
  if (!r.ok) throw new Error('خطای سرور (' + r.status + ')');
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('پاسخ سرور نامعتبر است؛ نسخهٔ جدید Code.gs منتشر شده؟'); }
  if (j && j.error) throw new Error(j.error);
  return j;
}
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 4500 : 2200);
}

/* ---------- تعریف فرم‌ها ---------- */
const F = {
  sale: {
    title:'فروش',
    fields:[
      {k:'date', l:'تاریخ', t:'date'},
      {k:'code', l:'محصول', t:'product'},
      {k:'qty', l:'تعداد', t:'num', def:1},
      {k:'price', l:'قیمت واحد', t:'num', opt:true, hint:'خالی بگذارید تا قیمت فهرست حساب شود'},
      {k:'note', l:'توضیح', t:'text', opt:true}
    ],
    card: o => ({
      t: (o.v.name || o.v.code) + ' × ' + o.v.qty,
      m: o.v.date + ' · ' + o.v.code + (o.v.note ? ' · ' + o.v.note : ''),
      a: money(o.x.amount)
    }),
    text: o => [o.v.date, o.v.code, o.v.name, o.v.note].join(' ')
  },
  stockIn: {
    title:'ورود کالا',
    fields:[
      {k:'date', l:'تاریخ', t:'date'},
      {k:'code', l:'محصول', t:'product'},
      {k:'qty', l:'تعداد', t:'num', def:1},
      {k:'type', l:'نوع ورود', t:'select', opts:'type'},
      {k:'fabric', l:'هزینه پارچه و ملزومات هر عدد', t:'num', opt:true},
      {k:'sewing', l:'هزینه دوخت هر عدد', t:'num', opt:true},
      {k:'buyer', l:'خریدار پارچه', t:'select', opts:'buyer', opt:true},
      {k:'note', l:'توضیح', t:'text', opt:true}
    ],
    card: o => ({
      t: (o.x.name || o.v.code) + ' × ' + o.v.qty,
      m: o.v.date + ' · ' + o.v.code + ' · ' + o.v.type,
      a: o.x.total ? money(o.x.total) : ''
    }),
    text: o => [o.v.date, o.v.code, o.x.name, o.v.type, o.v.note].join(' ')
  },
  expense: {
    title:'هزینه',
    fields:[
      {k:'date', l:'تاریخ', t:'date'},
      {k:'desc', l:'شرح', t:'text'},
      {k:'category', l:'دسته', t:'select', opts:'category'},
      {k:'amount', l:'مبلغ (تومان)', t:'num'},
      {k:'payer', l:'پرداخت‌کننده', t:'text', opt:true}
    ],
    card: o => ({ t:o.v.desc, m:o.v.date + ' · ' + o.v.category + (o.v.payer ? ' · ' + o.v.payer : ''), a:money(o.v.amount) }),
    text: o => [o.v.date, o.v.desc, o.v.category, o.v.payer].join(' ')
  },
  payment: {
    title:'پرداخت',
    fields:[
      {k:'date', l:'تاریخ', t:'date'},
      {k:'party', l:'طرف حساب', t:'select', opts:'party'},
      {k:'amount', l:'مبلغ (تومان)', t:'num'},
      {k:'desc', l:'توضیح', t:'text', opt:true}
    ],
    card: o => ({ t:o.v.party, m:o.v.date + (o.v.desc ? ' · ' + o.v.desc : ''), a:money(o.v.amount) }),
    text: o => [o.v.date, o.v.party, o.v.desc].join(' ')
  },
  product: {
    title:'محصول',
    fields:[
      {k:'code', l:'کد محصول', t:'text', hint:'مثل LZ-003-XL یا BB-005-04 — بعد از ثبت قابل تغییر نیست', lockOnEdit:true},
      {k:'name', l:'نام مدل', t:'text'},
      {k:'brand', l:'برند', t:'select', opts:'brand'},
      {k:'size', l:'سایز', t:'text', opt:true},
      {k:'color', l:'رنگ', t:'text', opt:true},
      {k:'price', l:'قیمت فروش (تومان)', t:'num', opt:true},
      {k:'mahin', l:'قیمت اعلامی مهین هر عدد (فقط BBandLili)', t:'num', opt:true}
    ],
    card: o => ({
      t: [o.v.name, o.v.color, o.v.size].filter(Boolean).join(' '),
      m: o.v.code + ' · ' + o.v.brand + ' · قیمت ' + money(o.v.price) +
         (o.v.brand === 'BBandLili' && !o.v.mahin ? ' · ⚠︎ قیمت مهین ثبت نشده' : ''),
      a: String(o.x.stock),
      pill: o.x.status
    }),
    text: o => [o.v.code, o.v.name, o.v.color, o.v.size, o.v.brand].join(' ')
  }
};

/* ---------- ورود و خروج ---------- */
async function start(){
  S.pin = store.get('lz_pin'); S.user = store.get('lz_user');
  if (!S.pin) return showLogin();
  $('view').innerHTML = '<div class="loading">در حال بارگذاری…</div>';
  showApp();
  try {
    S.init = await call('init');
    S.lists.product = S.init.products;
    render();
  } catch (e) {
    store.del('lz_pin');
    showLogin(e.message);
  }
}
function showLogin(msg){
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  $('lgUser').value = S.user || '';
  if (msg) toast(msg, true);
}
function showApp(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('whoName').textContent = S.user;
  $('nav').innerHTML = TABS.map(([k,l]) => `<button data-t="${k}">${l}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.t));
}
$('lgBtn').onclick = () => {
  const u = $('lgUser').value.trim(), p = enDigits($('lgPin').value.trim());
  if (!u || !p) return toast('نام و رمز را وارد کنید', true);
  store.set('lz_user', u); store.set('lz_pin', p);
  start();
};
$('logout').onclick = () => { store.del('lz_pin'); S.pin=''; showLogin(); };

/* ---------- ناوبری ---------- */
function go(tab){ S.tab = tab; S.q = ''; render(); window.scrollTo(0,0); }

async function render(){
  $('nav').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  const fab = $('fab');
  fab.classList.toggle('hidden', !F[S.tab] || S.tab === 'product');
  fab.onclick = () => openForm(S.tab);
  const v = $('view');

  if (S.tab === 'home') return renderHome();
  if (S.tab === 'accounts') return renderAccounts();
  if (S.tab === 'monthly') return renderMonthly();
  if (S.tab === 'weekly') return renderWeekly();

  v.innerHTML = '<div class="loading">در حال بارگذاری…</div>';
  try {
    const r = await call('list', {form:S.tab});
    S.lists[S.tab] = r.rows;
    renderList();
  } catch (e) { v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- خانه ---------- */
async function renderHome(){
  const v = $('view');
  if (!S.init) { v.innerHTML = '<div class="loading">در حال بارگذاری…</div>'; return; }
  const s = S.init.summary;
  v.innerHTML = `
    <h2>امروز · ${esc(s.today)}</h2>
    <div class="grid">
      <div class="card stat"><div class="l">فروش امروز</div><div class="v">${money(s.dAmt)}</div><div class="s">${s.dQty} لباس</div></div>
      <div class="card stat"><div class="l">این هفته (${esc(s.week)})</div><div class="v">${money(s.wAmt)}</div><div class="s">${s.wQty} لباس · سهم لیلیزی ${money(s.wShare)}</div></div>
      <div class="card stat"><div class="l">این ماه (${esc(s.month)})</div><div class="v">${money(s.mAmt)}</div><div class="s">${s.mQty} لباس · سهم لیلیزی ${money(s.mShare)}</div></div>
      <div class="card stat"><div class="l">موجودی</div><div class="v">${s.out} <span style="font-size:13px">تمام‌شده</span></div><div class="s">${s.low} مدل رو به اتمام</div></div>
    </div>
    <h2>حساب‌ها</h2>
    <div class="card">${s.figures.map(([l,x]) => `<div class="row"><span>${esc(l)}</span>${valSpan(x)}</div>`).join('')}</div>
    <div class="note">مبالغ به تومان · برای دیدن اعداد تازه، صفحه را پایین بکشید یا دوباره باز کنید.</div>`;
}

/* ---------- فهرست‌ها ---------- */
function renderList(){
  const f = F[S.tab], rows = newestFirst(S.lists[S.tab]);
  const q = S.q.trim();
  const shown = q ? rows.filter(o => f.text(o).toLowerCase().includes(q.toLowerCase())) : rows;
  const list = shown.slice(0, 150).map(o => {
    const c = f.card(o);
    const pill = c.pill ? `<span class="pill ${c.pill==='تمام شد'?'out':c.pill==='رو به اتمام'?'low':'ok'}">${esc(c.pill)}</span>` : '';
    return `<div class="card">
      <div class="item">
        <div class="main"><div class="t">${esc(c.t)}${pill}</div><div class="m">${esc(c.m)}</div></div>
        <div class="amt">${esc(c.a)}</div>
      </div>
      <div class="acts">
        <button data-e="${o.row}">${S.tab==='product' ? 'ویرایش قیمت / مشخصات' : 'ویرایش'}</button>
        ${S.tab==='product' ? '' : `<button class="del" data-d="${o.row}">حذف</button>`}
      </div></div>`;
  }).join('');
  $('view').innerHTML = `
    <h2>${S.tab==='product' ? 'موجودی کالا' : f.title} <span style="color:var(--muted);font-weight:400;font-size:13px">(${rows.length})</span></h2>

/* یک فیلد فرم (id جدا تا فیلدهای محصول جدید داخل فرم ورود کالا هم با همین ساخته شوند) */
function fieldHtml(fd, val, editing, id){

/* کد خودکار غیرتکراری: LZ-001 برای Lilizi و BB-001 برای BBandLili */
/* کد خودکار: LZ-شمارهٔ مدل-سایز (مثل LZ-003-XL، BB-005-04). هر مدل+رنگ یک شماره دارد؛ بدون سایز = فقط شماره */
const norm = t => enDigits(t).replace(/‌/g,' ').trim().replace(/\s+/g,' ');
function sizeTag(size){
  const t = norm(size).toUpperCase();
  if (!t || /بدون/.test(t)) return '';
  if (/^\d+$/.test(t)) return t.padStart(2, '0');
  return t.replace(/[^A-Z0-9]/g, '');
}
function autoCode(brand, name, color, size){
  const pre = brand === 'BBandLili' ? 'BB' : 'LZ';
  const re = new RegExp('^' + pre + '-(\\d{3})');
  const prods = S.lists.product || [];
  const used = new Set(prods.map(p => String(p.v.code).toUpperCase()));
  // اگر همین مدل و رنگ قبلاً ثبت شده، همان شماره
  const same = name && prods.find(p => re.test(String(p.v.code).toUpperCase()) &&
    norm(p.v.name) === norm(name) && norm(p.v.color) === norm(color));
  let num;
  if (same) num = String(same.v.code).toUpperCase().match(re)[1];
  else {
    let n = 0;
    used.forEach(c => { const m = c.match(re); if (m) n = Math.max(n, Number(m[1])); });
    num = String(n + 1).padStart(3, '0');
  }
  const tag = sizeTag(size);
  let code = pre + '-' + num + (tag ? '-' + tag : '');
  for (let k = 2; used.has(code); k++) code = pre + '-' + num + (tag ? '-' + tag : '') + '-' + k;
  return code;
}
function npAuto(force){
  const i = $('np_code'); if (!i) return;
  if (force || i.dataset.auto === '1' || !i.value.trim()) {
    i.value = autoCode($('np_brand').value, $('np_name').value, $('np_color').value, $('np_size').value);
    i.dataset.auto = '1';
  }
  const dup = (S.lists.product || []).find(p => $('np_name').value.trim() && norm(p.v.name) === norm($('np_name').value) &&
    norm(p.v.color) === norm($('np_color').value) && sizeTag(p.v.size) === sizeTag($('np_size').value) && norm(p.v.size) !== '' === (norm($('np_size').value) !== ''));
  const h = i.nextElementSibling;
  if (h && h.classList.contains('hint')) h.innerHTML = dup
    ? `<b style="color:var(--bad)">این محصول قبلاً با کد ${esc(dup.v.code)} ثبت شده؛ بهتر است «انصراف از محصول جدید» را بزنید و آن را از فهرست انتخاب کنید.</b>`
    : 'خودکار ساخته می‌شود: شمارهٔ مدل و رنگ + سایز (مثل LZ-003-XL). تکراری نیست و می‌توانید خودتان عوضش کنید.';
}
function npOn(){ const b = $('npBox'); return !!b && !b.classList.contains('hidden'); }

function codeFrom(v){ return enDigits(v).split(' — ')[0].trim().toUpperCase(); }

function readFields(fields, prefix, skip){
  const data = {};
  for (const fd of fields) {
    if (skip && skip(fd)) continue;
    let v = $(prefix + fd.k).value;
    if (fd.t === 'product') v = codeFrom(v);
    if (fd.t === 'num') v = enDigits(v).replace(/[^\d.]/g, '');
    if (fd.t === 'date') v = enDigits(v);
    if (fd.k === 'code') v = enDigits(v).trim().toUpperCase();
    if (!fd.opt && String(v).trim() === '') { toast(fd.l + ' را وارد کنید', true); return null; }
    data[fd.k] = v;
  }
  return data;
}

async function saveForm(form, row){
  if (form === 'stockIn' && !row && npOn()) return saveWithNewProduct();
  const f = F[form], data = {};
  for (const fd of f.fields) {
    let v = $('f_' + fd.k).value;
    if (fd.t === 'product') v = codeFrom(v);
    if (fd.t === 'num') v = enDigits(v).replace(/[^\d.]/g, '');
    if (fd.t === 'date') v = enDigits(v);
    if (!fd.opt && String(v).trim() === '') return toast(fd.l + ' را وارد کنید', true);
    data[fd.k] = v;
  }
  const btn = $('fSave'); btn.disabled = true; btn.textContent = 'در حال ذخیره…';
  try {
    await call('save', {form, row, data});
    closeForm(); toast('ذخیره شد');
    await refresh();
  } catch (e) {
    toast(e.message, true); btn.disabled = false; btn.textContent = 'ذخیره';

}

// جمع‌های نهایی: بدهی لیلیزی قرمز ▼، طلب لیلیزی سبز ▲ (اگر علامت عوض شود رنگ هم برعکس می‌شود)
function totalSpan(label, x){
  const L = String(label||'');
  if (/^مانده اولیه/.test(L)) return valSpan(x);
  const debt = /^مانده.*بدهی|^جمع بدهی|^به مهین \+ لیلی/.test(L);
  const cred = /^مانده.*طلب/.test(L);
  if (!debt && !cred) return valSpan(x);
  const s = String(x==null?'':x).trim();
  let n;
  if (s.startsWith('▼')) n = debt ? num(s) : -num(s);
  else if (s.startsWith('▲')) n = debt ? -num(s) : num(s);
  else n = num(x);
  if (!n) return valSpan(x);
  const owe = debt ? n > 0 : n < 0;   // لیلیزی بدهکار است؟
  const t = (owe ? '▼ ' : '▲ ') + Math.abs(Math.round(n)).toLocaleString('en-US');
  return `<span class="v ${owe ? 'neg' : 'pos'}" style="font-weight:700">${t}</span>`;
}

/* ---------- گزارش هفتگی ---------- */
// مثل شیت: روز سال از اول فروردین، هفته = سقف(روز/۷)
const doyOf = d => { const [y,m,dd] = enDigits(d).split('/').map(Number); if (!y||!m||!dd) return null;
  return {y, doy: m <= 6 ? (m-1)*31 + dd : 186 + (m-7)*30 + dd}; };
const weekOf = d => { const o = doyOf(d); return o ? o.y + '-' + String(Math.ceil(o.doy/7)).padStart(2,'0') : ''; };
const dateOf = (y, doy) => { let m, d; if (doy <= 186) { m = Math.ceil(doy/31); d = doy - (m-1)*31; } else { m = 7 + Math.ceil((doy-186)/30) - 1; d = doy - 186 - (m-7)*30; }
  return y + '/' + String(m).padStart(2,'0') + '/' + String(d).padStart(2,'0'); };
const weekRange = w => { const [y, n] = w.split('-').map(Number); const a = (n-1)*7 + 1; return [dateOf(y, a), dateOf(y, Math.min(a+6, 365))]; };
const prevWeek = w => { const [y, n] = w.split('-').map(Number); return n > 1 ? y + '-' + String(n-1).padStart(2,'0') : (y-1) + '-52'; };
const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const dayLabel = d => { const [, m, dd] = d.split('/').map(Number); return dd + ' ' + MONTHS[m-1]; };

async function renderWeekly(){
  const v = $('view');
  v.innerHTML = '<div class="loading">در حال بارگذاری…</div>';
  try {
    const [sr, ir] = await Promise.all([call('list',{form:'sale'}), call('list',{form:'stockIn'}).catch(() => ({rows:[]}))]);
    const sales = sr.rows || [], ins = ir.rows || [];
    const prods = {}; (S.lists.product || []).forEach(p => prods[p.v.code] = p);
    // بهای تمام‌شدهٔ هر عدد (میانگین وزنی پارچه + دوخت از ورود کالا)
    const cst = {};
    ins.forEach(o => { const c = num(o.v.fabric) + num(o.v.sewing), q = num(o.v.qty) || 1; if (!c) return;
      const a = cst[o.v.code] || (cst[o.v.code] = {s:0, q:0}); a.s += c*q; a.q += q; });
    const RATE = 0.3;
    const rec = sales.map(o => {
      const p = prods[o.v.code], brand = (p && p.v.brand) || 'Lilizi', qty = num(o.v.qty) || 1, amt = num(o.x && o.x.amount);
      const mah = brand === 'BBandLili' ? num(p && p.v.mahin) * qty : 0;
      const share = amt * (1 - RATE) - mah;
      const cost = brand === 'BBandLili' ? 0 : (cst[o.v.code] ? cst[o.v.code].s / cst[o.v.code].q * qty : 0);
      return {o, p, brand, qty, amt, share, gross: share - cost, w: weekOf(o.v.date), doy: (doyOf(o.v.date)||{}).doy,
        model: p ? [p.v.name, p.v.color].filter(Boolean).join(' ') : (o.x && o.x.name) || o.v.code};
    });
    const cur = weekOf(S.init.today);
    const weeks = [...new Set([cur, ...rec.map(r => r.w).filter(Boolean)])].sort().reverse();

    const draw = w => {
      const R = rec.filter(r => r.w === w), P = rec.filter(r => r.w === prevWeek(w));
      const sum = (A, k) => A.reduce((s, r) => s + r[k], 0);
      const [d1, d2] = weekRange(w);
      const delta = (a, b) => b && a === b ? '<div class="s">مثل هفتهٔ قبل</div>' : b ? `<div class="s">${a >= b ? '▲' : '▼'} ${Math.abs(Math.round((a-b)/b*100))}٪ نسبت به هفتهٔ قبل</div>` : `<div class="s">هفتهٔ قبل: ${fmtN(b)}</div>`;
      const stat = (l, val, prev, extra) => `<div class="card stat"><div class="l">${l}</div><div class="v">${fmtN(val)}</div>${extra||''}${delta(val, prev)}</div>`;
      // روزهای هفته
      const [y, n] = w.split('-').map(Number), a = (n-1)*7 + 1;
      const days = [...Array(7)].map((_, i) => { const dd = a + i, X = R.filter(r => r.doy === dd); return {d: dateOf(y, dd), q: sum(X,'qty'), m: sum(X,'amt')}; });
      const mx = Math.max(1, ...days.map(d => d.m));
      // پرفروش‌ها بر اساس مدل
      const byM = {}; R.forEach(r => { const k = r.model; (byM[k] = byM[k] || {q:0, m:0, b:r.brand}); byM[k].q += r.qty; byM[k].m += r.amt; });
      const top = Object.entries(byM).sort((x, y2) => y2[1].q - x[1].q || y2[1].m - x[1].m);
      const brand = b => { const X = R.filter(r => (b === 'BBandLili') === (r.brand === 'BBandLili')); return {q: sum(X,'qty'), m: sum(X,'amt'), s: sum(X,'share')}; };
      const L = brand('Lilizi'), B = brand('BBandLili');
      // موجودی: فروش‌رفته‌های این هفته که تمام شده یا رو به اتمام‌اند
      const soldCodes = [...new Set(R.map(r => r.o.v.code))];
      const alerts = soldCodes.map(c => prods[c]).filter(p => p && (p.x.status === 'تمام شد' || p.x.status === 'رو به اتمام'));
      const outAll = (S.lists.product || []).filter(p => p.x.status === 'تمام شد');

      $('wBody').innerHTML = `
        <div class="note">${esc(d1)} تا ${esc(d2)}${w === cur ? ' · هفتهٔ جاری (هنوز تمام نشده)' : ''}</div>
        <div class="grid">
          ${stat('تعداد لباس فروخته‌شده', sum(R,'qty'), sum(P,'qty'))}
          ${stat('مبلغ فروش', sum(R,'amt'), sum(P,'amt'))}
          ${stat('درآمد لیلیزی', sum(R,'share'), sum(P,'share'), '<div class="s">بعد از کسر ۳۰٪ همدانی و سهم مهین</div>')}
          ${stat('سود ناخالص', sum(R,'gross'), sum(P,'gross'), '<div class="s">درآمد منهای بهای تمام‌شده</div>')}
        </div>
        <h2>به تفکیک برند</h2>
        <div class="card">
          <div class="row"><span>Lilizi · ${L.q} لباس</span><span class="v">${fmtN(L.m)}</span></div>
          <div class="row"><span>BBandLili · ${B.q} لباس</span><span class="v">${fmtN(B.m)}</span></div>
        </div>
        <h2>روزهای هفته</h2>
        <div class="card">${days.map((d, i) => `<div class="row" style="align-items:center">
          <span style="flex:0 0 92px">${dayLabel(d.d)}</span>
          <span style="flex:1;height:10px;background:var(--brand-soft);border-radius:6px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(d.m/mx*100)}%;background:var(--brand)"></span></span>
          <span class="v" style="flex:0 0 96px;text-align:left">${d.q ? d.q + ' · ' + fmtN(d.m) : '—'}</span></div>`).join('')}</div>
        <h2>پرفروش‌ترین مدل‌ها</h2>
        <div class="card">${top.length ? top.slice(0, 8).map(([k, x]) => `<div class="row"><span>${esc(k)} <span style="color:var(--muted);font-size:12px">${x.b === 'BBandLili' ? 'BB' : 'LZ'}</span></span><span class="v" style="direction:rtl">${x.q} عدد · <span dir="ltr">${fmtN(x.m)}</span></span></div>`).join('') : '<div class="note">این هفته فروشی ثبت نشده.</div>'}</div>
        <h2>فروش‌های این هفته</h2>
        <div class="card">${R.length ? R.slice().sort((x, y2) => (y2.doy||0) - (x.doy||0)).map(r => `<div class="row"><span>${esc((r.o.x && r.o.x.name) || r.model)} × ${r.qty}<br><span style="color:var(--muted);font-size:12px">${esc(r.o.v.date)} · ${esc(r.o.v.code)}</span></span><span class="v">${fmtN(r.amt)}</span></div>`).join('') : '<div class="note">—</div>'}</div>
        <h2>موجودی</h2>
        <div class="card">
          ${alerts.length ? '<div class="row sec">از فروش‌رفته‌های این هفته</div>' + alerts.map(p => `<div class="row"><span>${esc(productLabel(p).split(' (')[0])}</span><span class="pill ${p.x.status === 'تمام شد' ? 'out' : 'low'}">${esc(p.x.status)} · ${p.x.stock}</span></div>`).join('') : ''}
          <div class="row"><span>کل کدهای تمام‌شده</span><span class="v">${outAll.length}</span></div>
          <div class="note">${outAll.map(p => esc([p.v.name, p.v.color, p.v.size].filter(Boolean).join(' '))).join('، ') || '—'}</div>
        </div>
        <div class="note">سهم همدانی ۳۰٪ فرض شده. بهای تمام‌شده از هزینهٔ پارچه و دوخت در «ورود کالا» است؛ لباس‌هایی که هزینه ندارند صفر حساب شده‌اند.</div>`;
    };
    v.innerHTML = `<h2>گزارش هفتگی</h2>
      <select class="in" id="wSel" style="margin-bottom:10px">${weeks.map(w => { const [a1, a2] = weekRange(w); return `<option value="${w}">هفتهٔ ${esc(w.split('-')[1])} · ${esc(a1.slice(5))} تا ${esc(a2.slice(5))}${w === cur ? ' (جاری)' : ''}</option>`; }).join('')}</select>
      <div id="wBody"></div>`;
    $('wSel').onchange = () => draw($('wSel').value);
    draw(weeks[0]);
  } catch (e) { v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* داده‌های لازم برای وضعیت تسویه و تحلیل */
function buildCtx(t, hi, sales, pays, ins, secs){
  const head = t[hi];
  const row = key => t.find(r => r[0] && r[0].trim() === key) || t.find(r => r[0] && r[0].includes(key));
  const get = (key, m) => { const r = row(key), ci = head.indexOf(m); return r && ci > 0 ? num(r[ci]) : 0; };
  const months = head.slice(1).filter(Boolean);
  const mOf = d => String(d||'').slice(0,7);
  const prods = {}; (S.lists.product || []).forEach(p => prods[p.v.code] = p);
  sales = sales || []; pays = pays || []; ins = ins || [];

  // نرخ همدانی از خود جدول
  let rate = 0.3;
  for (const m of months) { const a = get('فروش کل', m); if (a) { rate = get('سهم همدانی', m) / a; break; } }

  // بدهی هر ماه بر اساس فروش‌ها (شامل ماه‌هایی که در جدول نیستند)
  const dueH = {}, dueM = {}, saleMonths = new Set();
  sales.forEach(o => {
    const m = mOf(o.v.date), amt = num(o.x && o.x.amount), p = prods[o.v.code];
    saleMonths.add(m);
    dueH[m] = (dueH[m]||0) + amt * (1 - rate);
    if (p && p.v.brand === 'BBandLili') dueM[m] = (dueM[m]||0) + num(p.v.mahin) * (num(o.v.qty) || 1);
  });
  const paid = party => pays.filter(o => o.v.party === party).reduce((s,o) => s + num(o.v.amount), 0);

  // تخصیص پرداخت‌ها به ماه‌ها به ترتیب (قدیمی‌ترین اول)
  const fifo = (dues, total, opening) => {
    let left = total - (opening || 0); const res = {};
    Object.keys(dues).sort().forEach(m => {
      const d = dues[m]; if (!d) return;
      const cov = Math.max(0, Math.min(d, left)); left -= cov; res[m] = {due:d, cov};
    });
    return {res, extra: Math.max(0, left)};
  };
  const tableDues = key => { const o = {}; months.forEach(m => { const x = get(key, m); if (x > 0) o[m] = x; }); return o; };

  let mahinOpen = 0;
  (secs || []).forEach(sec => sec.rows.forEach(r => {
    if (r.length > 1 && /مانده اولیه/.test(r[0]) && /دوره|دوخت/.test(r[0]) && /مهین/.test(sec.title||'')) mahinOpen = num(r[r.length-1]);
  }));

  // محصولاتی که بهای تمام‌شده ندارند
  const costed = new Set(ins.filter(o => num(o.v.fabric) || num(o.v.sewing)).map(o => o.v.code));

  return {
    get, months, rate, sales, prods, costed, saleMonths, mOf,
    H: fifo(dueH, paid('همدانی')),
    MB: fifo(dueM, paid('مهین - BBandLili')),
    MP: fifo(tableDues('بدهی جدید به مهین بابت تولید'), paid('مهین - لیلیزی'), mahinOpen),
    B: fifo(tableDues('حقوق بهناز'), paid('بهناز - برداشت')),
    SL: fifo(tableDues('حقوق فروشنده'), paid('حقوق فروشنده')),
    paidH: paid('همدانی'), dueHtotal: Object.values(dueH).reduce((a,b)=>a+b,0)
  };
}

function settleTag(c, label, m, val){
  if (!val) return '';
  const pill = (cls, txt) => `<span class="pill ${cls}">${txt}</span>`;
  const st = (f, who) => {
    const x = f.res[m]; if (!x) return '';
    if (x.cov >= x.due - 1) return pill('ok', '✓ تسویه شد');
    if (x.cov > 0) return pill('low', '◐ ' + fmtN(x.due - x.cov) + ' مانده');
    return pill('out', '⏳ ' + who);
  };
  if (label === 'سهم همدانی') return pill('ok', '✓ همدانی موقع فروش برداشته');
  if (label.includes('نزد همدانی')) return st(c.H, 'همدانی هنوز واریز نکرده');
  if (label === 'سهم مهین از فروش BBandLili' || label.includes('مهین بابت BBandLili')) return st(c.MB, 'به مهین پرداخت نشده');
  if (label.includes('مهین بابت تولید')) return st(c.MP, 'به مهین پرداخت نشده');
  if (label === 'حقوق بهناز') return st(c.B, 'برداشت ثبت نشده');
  if (label === 'حقوق فروشنده') return st(c.SL, 'پرداخت ثبت نشده');
  if (label === 'هزینه‌های جاری') return pill('ok', '✓ پرداخت‌شده');
  return '';
}

function analysis(c, m){
  const g = k => c.get(k, m);
  const sale = g('فروش کل'), H = g('سهم همدانی'), M = g('سهم مهین از فروش BBandLili'), inc = g('درآمد لیلیزی');
  const cogs = g('بهای تمام‌شده لباس‌های فروخته‌شده'), gross = g('سود ناخالص'), exp = g('هزینه‌های جاری');
  const sB = g('حقوق بهناز'), sS = g('حقوق فروشنده'), net = g('سود (زیان) خالص'), shB = g('سهم بهناز از سود');
  const fixed = exp + sB + sS;
  const b = n => `<b>${fmtN(n)}</b>`;
  const P = [];
  if (!sale && !fixed) return '<p>برای این ماه هنوز چیزی ثبت نشده.</p>';

  P.push(`<p>۱) از ${b(sale)} فروش، ${b(H)} سهم همدانی و ${b(M)} سهم مهین (لباس‌های BBandLili) کم می‌شود؛ درآمد خود لیلیزی ${b(inc)} است.</p>`);
  P.push(`<p>۲) بهای تمام‌شدهٔ لباس‌های لیلیزی فروخته‌شده ${b(cogs)} است، پس سود ناخالص ${b(gross)} می‌ماند${sale ? ` (یعنی از هر ۱۰۰ تومان فروش، حدود ${Math.round(gross/sale*100)} تومان)` : ''}.</p>`);
  P.push(`<p>۳) هزینه‌های ثابت ماه ${b(fixed)} است: حقوق بهناز ${b(sB)}، حقوق فروشنده ${b(sS)} و هزینه‌های جاری ${b(exp)}.</p>`);
  if (net < 0) {
    P.push(`<p>۴) <b class="neg">${fmtN(net)}</b> زیان یعنی سود ناخالص (${b(gross)}) کمتر از هزینه‌های ثابت (${b(fixed)}) بوده؛ ${b(-net)} کسری است. ${sB+sS ? `حقوق‌ها (${b(sB+sS)}) به‌تنهایی ${gross ? (Math.round((sB+sS)/gross*10)/10) + ' برابر سود ناخالص است' : 'بیشتر از سود ناخالص است'}.` : ''}</p>`);
  } else {
    P.push(`<p>۴) سود ناخالص از هزینه‌های ثابت بیشتر بوده، پس ${b(net)} سود خالص مانده.</p>`);
  }
  if (gross > 0 && sale) {
    const be = fixed / (gross / sale);
    P.push(`<p>۵) نقطهٔ سر به سر: با همین ترکیب فروش، برای پوشش هزینه‌های ثابت فروش ماهانه باید حدود ${b(Math.ceil(be/100000)*100000)} باشد (این ماه ${b(sale)}).</p>`);
  }
  if (sB) P.push(`<p>۶) حقوق بهناز هم هزینهٔ شرکت حساب می‌شود و هم بهناز ۵۰٪ سود/زیان را دارد. پس نتیجهٔ این ماه برای بهناز: حقوق ${b(sB)} ${shB<0?'منهای سهم زیان '+b(-shB):'به‌اضافهٔ سهم سود '+b(shB)} = ${b(sB+shB)}؛ برای لیلی فقط سهم ${shB<0?'زیان':'سود'}: ${b(net - shB)}.</p>`);

  // هشدارها
  const W = [];
  const ms = c.sales.filter(o => c.mOf(o.v.date) === m);
  const noCost = [...new Set(ms.filter(o => { const p = c.prods[o.v.code]; return p && p.v.brand !== 'BBandLili' && !c.costed.has(o.v.code); })
    .map(o => o.v.name || o.v.code))];
  if (noCost.length) W.push(`بهای تمام‌شدهٔ این لباس‌ها ثبت نشده و صفر حساب شده، پس سود واقعی کمتر از این است: ${noCost.map(esc).join('، ')}. هزینهٔ پارچه و دوخت را در «ورود کالا» وارد کنید.`);
  const noBrand = [...new Set(ms.filter(o => { const p = c.prods[o.v.code]; return p && !p.v.brand; }).map(o => o.v.name || o.v.code))];
  if (noBrand.length) W.push(`برند این محصولات خالی است و لیلیزی فرض شده: ${noBrand.map(esc).join('، ')}.`);
  const noMahin = [...new Set(ms.filter(o => { const p = c.prods[o.v.code]; return p && p.v.brand === 'BBandLili' && !num(p.v.mahin); }).map(o => o.v.name || o.v.code))];
  if (noMahin.length) W.push(`قیمت اعلامی مهین برای این لباس‌های BBandLili ثبت نشده: ${noMahin.map(esc).join('، ')}.`);
  const today = (S.init && S.init.today) || '';
  if (S.init && S.init.summary.month === m && sB + sS) W.push(`این ماه هنوز تمام نشده (امروز ${esc(today)}) ولی حقوق کامل ماه کم شده؛ عدد نهایی با فروش‌های باقی‌ماندهٔ ماه بهتر می‌شود.`);
  const extra = c.paidH - c.dueHtotal;
  if (extra > 1000) W.push(`همدانی ${fmtN(extra)} بیشتر از سهم فروش‌های ثبت‌شده واریز کرده؛ احتمالاً بخشی از فروش‌ها (مثلاً شهریور یا مهر) ثبت نشده.`);
  const outside = [...c.saleMonths].filter(x => x && !c.months.includes(x)).sort();
  if (outside.length) W.push(`فروش‌های ماه ${outside.map(esc).join('، ')} در این جدول نیست ولی در حساب همدانی و مهین حساب شده.`);
  if (c.SL.res[m] && c.SL.res[m].cov < c.SL.res[m].due) W.push('اگر حقوق فروشنده پرداخت شده، آن را در «پرداخت» با طرف حساب «حقوق فروشنده» ثبت کنید تا موجودی نقد درست شود.');
  if (W.length) P.push('<p class="w">⚠︎ نکته‌ها:</p>' + W.map(w => `<p class="w">• ${w}</p>`).join(''));
  return P.join('');
}
